<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Manoir de l'Horloger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Un seul univers : le manoir d'un horloger, la nuit. Colonne type téléphone, scène au centre, inventaire en bas. */
  color-scheme: dark;
  --night:#0f1a24;      /* fond de l'appli */
  --panel:#182733;      /* bandeaux */
  --wood:#5a3d28;       /* boiseries, encre des fiches */
  --brass:#cfa650;      /* accent : laiton */
  --paper:#efe4c8;      /* texte et papiers */
  --muted:#9fb0b8;
  --display:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.app{position:relative;height:100%;max-width:460px;margin:0 auto;display:grid;
  grid-template-rows:auto minmax(0,1fr) auto auto auto;background:var(--panel);overflow:hidden}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 16px}
.step{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:400;font-size:1.3rem;line-height:1.15;margin:0;text-wrap:balance}
.timer{font-variant-numeric:tabular-nums;color:var(--brass);font-weight:700;font-size:1rem}

.scene{position:relative;min-height:0;background:#0a1219}
.scene svg{display:block;width:100%;height:100%}
.scene [data-a]{cursor:pointer}

.msg{min-height:5.2em;padding:10px 16px;font-size:.95rem;border-top:1px solid rgba(207,166,80,.35)}
.msg p{margin:0}

.inv{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:0 16px 8px}
.slot{aspect-ratio:1;max-height:56px;border:1px solid rgba(159,176,184,.3);border-radius:8px;background:#101b25;padding:3px;display:grid;place-items:center}
.slot svg{width:100%;height:100%}
.slot[aria-pressed="true"]{border-color:var(--brass);background:#2a2a1c;box-shadow:0 0 0 2px var(--brass) inset}
.slot:disabled{cursor:default;opacity:.6}

.bar{display:flex;gap:8px;padding:0 16px 12px}
.btn{flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--brass);background:transparent;color:var(--brass);font-weight:700}
.btn.solid{background:var(--brass);color:#1b1608}
.btn.quiet{border-color:rgba(159,176,184,.4);color:var(--muted);font-weight:400}
.btn:active{transform:translateY(1px)}

.veil{position:absolute;inset:0;background:rgba(5,10,15,.8);display:grid;place-items:center;padding:16px;z-index:5}
.veil[hidden]{display:none}
.sheet{width:100%;max-width:380px;max-height:100%;overflow:auto;background:var(--paper);color:#22190f;border-radius:6px;
  padding:18px 18px 16px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.sheet h2{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0 0 8px;text-wrap:balance}
.sheet p{margin:0 0 10px}
.sheet .hand{font-family:var(--display);font-style:italic;font-size:1.15rem;line-height:1.4}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sheet .btn{border-color:var(--wood);color:var(--wood)}
.sheet .btn.solid{background:var(--wood);color:var(--paper)}
.sheet .big svg{display:block;width:100%;height:auto;border-radius:4px}
.wheels{display:flex;justify-content:center;gap:10px;margin:10px 0}
.wheel{display:flex;flex-direction:column;align-items:center;gap:4px}
.wheel button{width:48px;height:36px;border:1px solid var(--wood);border-radius:6px;background:transparent;color:var(--wood);font-size:1rem}
.wheel output{width:48px;height:56px;display:grid;place-items:center;background:#22190f;color:var(--brass);
  font-size:1.8rem;font-weight:700;border-radius:6px;font-variant-numeric:tabular-nums}
.dialbox{display:flex;justify-content:center;margin:6px 0}
.dialbox svg{width:200px;height:200px}
.set{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.set div{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid rgba(90,61,40,.4);border-radius:6px;padding:4px}
.set span{font-size:.85rem}
.set button{width:40px;height:40px;border:1px solid var(--wood);border-radius:6px;background:transparent;color:var(--wood);font-size:1.2rem}
.note{font-size:.9rem;color:#5a4630}
.stats{display:flex;gap:20px;margin:6px 0 4px}
.stats b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:#5a4630}
.rooms{display:grid;gap:6px;margin:8px 0}
.rooms button{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;border:1px solid rgba(90,61,40,.45);border-radius:6px;background:transparent;color:#22190f}
.rooms button b{font-family:var(--display);font-weight:400;font-size:1.2rem;width:1.6em;text-align:center}
.rooms button span{flex:1}
.rooms button i{font-style:normal;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:#5a4630}
.rooms button[aria-current="true"]{border-color:var(--wood);box-shadow:0 0 0 2px var(--wood) inset}
.rooms button:disabled{opacity:.45;cursor:default}

@keyframes swing{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.pend{transform-box:fill-box;transform-origin:50% 0;animation:swing 1s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){.pend{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="step" id="step"></div>
      <h1 id="title"></h1>
    </div>
    <div class="timer" id="timer" aria-label="Temps écoulé">00:00</div>
  </header>

  <div class="scene"><div id="stage" style="height:100%"></div></div>

  <div class="msg" aria-live="polite"><p id="msg"></p></div>

  <div class="inv" id="inv" aria-label="Inventaire"></div>

  <div class="bar">
    <button class="btn" data-a="hint">Indice</button>
    <button class="btn quiet" data-a="rooms">Chambres</button>
  </div>

  <div class="veil" id="veil" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
</div>

<script>
(function(){
"use strict";

var KEY = "manoir-horloger-v2";
var SERIF = 'font-family="IM Fell English, Georgia, serif"';
var $ = function(id){ return document.getElementById(id); };

var ITEMS = {
  cle:{n:"Clé en laiton", s:'<circle cx="13" cy="20" r="7" fill="none" stroke="#cfa650" stroke-width="4"/><path d="M20 20h16M30 20v6M35 20v5" stroke="#cfa650" stroke-width="4" fill="none"/>'},
  clefer:{n:"Clé de fer", s:'<circle cx="12" cy="20" r="8" fill="none" stroke="#8d979d" stroke-width="5"/><path d="M20 20h16M29 20v8M35 20v6" stroke="#8d979d" stroke-width="5" fill="none"/>'},
  fiole:{n:"Fiole d'acide", s:'<rect x="17" y="5" width="6" height="12" fill="#b9c2c8"/><circle cx="20" cy="25" r="10" fill="#7fe08a" stroke="#b9c2c8" stroke-width="2"/>'},
  clecap:{n:"Clé du capitaine", s:'<circle cx="12" cy="20" r="8" fill="none" stroke="#e0b040" stroke-width="4"/><circle cx="12" cy="20" r="2" fill="#e0b040"/><path d="M20 20h16M30 20v7M35 20v5" stroke="#e0b040" stroke-width="4" fill="none"/>'},
  clemus:{n:"Clé d'argent", s:'<path d="M8 14q5-8 10 0t-10 12" fill="none" stroke="#d5dde2" stroke-width="3.5"/><path d="M16 20h20M30 20v6M35 20v5" stroke="#d5dde2" stroke-width="3.5" fill="none"/>'}
};

/* ---------- État ---------- */
function fresh(){ return {r:0,max:0,f:null,inv:[],sel:null,t:0,h:0,hl:{},go:false,won:false,msg:""}; }
var S = fresh();
var tmp = {code:[],cb:null,ans:""};

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ var r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function has(i){ return S.inv.indexOf(i) >= 0; }
function give(i){ if(!has(i)) S.inv.push(i); }
function drop(i){ S.inv = S.inv.filter(function(x){return x!==i;}); if(S.sel===i) S.sel=null; }
function say(m){ S.msg = m; }
function fmt(t){ var m=Math.floor(t/60), s=t%60; return (m<10?"0":"")+m+":"+(s<10?"0":"")+s; }
function needSel(what){ return what+" Sélectionnez d'abord un objet dans l'inventaire, puis touchez à nouveau."; }

var AC=null;
function tone(fr,len){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(), g=AC.createGain(), n=AC.currentTime, d=len||0.8;
    o.type="triangle"; o.frequency.value=fr;
    g.gain.setValueAtTime(0.2,n); g.gain.exponentialRampToValueAtTime(0.001,n+d);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(n+d);
  }catch(e){}
}
/* Avance dans une séquence : "more", "ok" ou "bad" (remise à zéro). */
function seq(ch,target){
  var f=S.f; f.seq=(f.seq||"")+ch;
  if(target.indexOf(f.seq)!==0){ f.seq=""; return "bad"; }
  if(f.seq===target){ return "ok"; }
  return "more";
}

/* ---------- Dessin commun ---------- */
function hs(id,label,inner){ return '<g data-a="hs:'+id+'" role="button" tabindex="0" aria-label="'+label+'">'+inner+'</g>'; }
function R(x,y,w,h,fill,more){ return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" '+(more||'')+'/>'; }
function C(x,y,r,fill,more){ return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+fill+'" '+(more||'')+'/>'; }
function T(x,y,t,size,fill,more){ return '<text x="'+x+'" y="'+y+'" text-anchor="middle" font-size="'+size+'" fill="'+fill+'" '+(more||SERIF)+'>'+t+'</text>'; }

function bg(th){
  var planks="";
  for(var i=1;i<6;i++) planks+='<path d="M0 '+(330+i*15)+'H360" stroke="#000" stroke-opacity=".3" stroke-width="1"/>';
  return '<defs><pattern id="wp" width="24" height="24" patternUnits="userSpaceOnUse">'+R(0,0,24,24,th.w)+R(0,0,12,24,th.w2)+'</pattern></defs>'
    +R(0,0,360,420,"url(#wp)")+R(0,255,360,75,th.p)+R(0,250,360,6,th.d)+R(0,330,360,90,th.fl)+planks+R(0,324,360,7,"#000",'opacity=".45"');
}
function door(th,kind){
  var d=R(254,92,88,238,"#000",'opacity=".55"')+R(260,98,76,232,th.d)
    +R(269,110,58,86,"none",'stroke="#000" stroke-opacity=".35" stroke-width="3"')+R(269,214,58,104,"none",'stroke="#000" stroke-opacity=".35" stroke-width="3"');
  if(kind==="key") d+=R(312,196,18,34,"#2b2f33",'rx="3"')+C(321,208,3.5,"#0a0d10")+R(319.7,208,2.6,11,"#0a0d10");
  else if(kind==="code"){
    d+=R(306,190,26,40,"#2b2f33",'rx="3"');
    for(var i=0;i<6;i++) d+=C(313+(i%2)*12,199+Math.floor(i/2)*11,2.6,"#cfa650");
  } else d+=C(322,212,6,"#cfa650")+C(322,212,2.5,"#2b2f33");
  return hs("door","Porte de sortie",d);
}
function dial(cx,cy,r,big){
  var f=S.f, o=C(cx,cy,r,"#efe4c8",'stroke="#cfa650" stroke-width="'+(big?5:3)+'"'), i;
  var num=["XII","I","II","III","IV","V","VI","VII","VIII","IX","X","XI"];
  for(i=0;i<12;i++){
    o+='<line x1="'+cx+'" y1="'+(cy-r+(big?6:3))+'" x2="'+cx+'" y2="'+(cy-r+(big?12:7))+'" stroke="#22190f" stroke-width="'+(big?2:1)+'" transform="rotate('+(i*30)+' '+cx+' '+cy+')"/>';
    if(big){ var a=i*30*Math.PI/180; o+=T(cx+Math.sin(a)*(r-24), cy-Math.cos(a)*(r-24)+4.5, num[i], 12, "#22190f"); }
  }
  o+='<line x1="'+cx+'" y1="'+cy+'" x2="'+cx+'" y2="'+(cy-r*0.72)+'" stroke="#22190f" stroke-width="'+(big?3:1.6)+'" stroke-linecap="round" transform="rotate('+(f.cm*6)+' '+cx+' '+cy+')"/>';
  o+='<line x1="'+cx+'" y1="'+cy+'" x2="'+cx+'" y2="'+(cy-r*0.45)+'" stroke="#22190f" stroke-width="'+(big?6:3)+'" stroke-linecap="round" transform="rotate('+((f.ch%12)*30+f.cm*0.5)+' '+cx+' '+cy+')"/>';
  return o+C(cx,cy,big?5:2.5,"#cfa650");
}
function sun(x,y,c){ var o=C(x,y,7,c); for(var i=0;i<8;i++) o+='<line x1="'+x+'" y1="'+(y-10)+'" x2="'+x+'" y2="'+(y-14)+'" stroke="'+c+'" stroke-width="2" transform="rotate('+(i*45)+' '+x+' '+y+')"/>'; return o; }
function eye(x,y,c){ return '<path d="M'+(x-14)+' '+y+'q14-13 28 0q-14 13-28 0z" fill="none" stroke="'+c+'" stroke-width="2.5"/>'+C(x,y,4,c); }
function pyr(x,y,c){ return '<path d="M'+(x-13)+' '+(y+10)+'L'+x+' '+(y-12)+'L'+(x+13)+' '+(y+10)+'z" fill="none" stroke="'+c+'" stroke-width="2.5"/><path d="M'+x+' '+(y-12)+'L'+(x+4)+' '+(y+10)+'" stroke="'+c+'" stroke-width="1.5"/>'; }

/* ---------- Les dix chambres ---------- */
var SHELVES=["BRNGBNO","ONBROBN","RGNBON"];
var BOOKC={R:"#b03a30",B:"#2f64a6",G:"#3f8a55",O:"#e0b040",N:"#6c675f"};
var FLASK={R:["#c0392b","rouge"],V:["#3f9a55","verte"],J:["#e6c034","jaune"],B:["#2f6fc0","bleue"]};
var BELLS=[3,5,1,4,2], BELLHZ={5:262,4:330,3:392,2:494,1:587};
var VALVES=[[0,1],[1,2],[2,3],[0,2,3]];
var SHIELDS=["M","S","E","T","P"];

function mapSvg(){
  var o=R(0,0,140,96,"#e2d3a6",'stroke="#8a6d2f" stroke-width="3"'), x, y;
  for(x=30;x<=110;x+=20) for(y=18;y<=78;y+=20) o+=C(x,y,1.3,"#8a6d2f");
  o+='<path d="M30 78V38H50V58H90V38" fill="none" stroke="#a33a32" stroke-width="2.5" stroke-dasharray="5 3"/>';
  o+=C(30,78,5,"none",'stroke="#22190f" stroke-width="2"')+'<path d="M30 70v16M25 82q5 5 10 0" stroke="#22190f" stroke-width="2" fill="none"/>';
  o+='<path d="M85 33l10 10M95 33l-10 10" stroke="#a33a32" stroke-width="3"/>';
  o+='<path d="M124 30V12M119 18l5-7 5 7" stroke="#22190f" stroke-width="2" fill="none"/>'+T(124,42,"N",11,"#22190f");
  return o;
}

var ROOMS = [
/* 1 */{
  n:"L'atelier de l'horloger", th:{w:"#27404f",w2:"#2b4656",p:"#3a2a1d",fl:"#4a3220",d:"#5a3d28"}, door:"key", key:"clefer",
  intro:"Vous vous réveillez dans l'atelier de maître Anselme, horloger. Dix chambres vous séparent de la sortie du manoir. Touchez les objets pour fouiller.",
  locked:"La porte est verrouillée. Une serrure massive en fer forgé.",
  init:function(){ return {ch:3,cm:40}; },
  draw:function(f){
    var clock=R(24,310,60,20,"#3a2616")+R(30,150,48,162,"#4a2f1c")+R(22,72,64,82,"#4a2f1c",'rx="6"')+dial(54,112,24,false)
      +R(40,166,28,100,"#0d1419",'stroke="#cfa650" stroke-width="1.5"')
      +'<g class="'+(f.clockOpen?'pend':'')+'">'+R(53,168,2,58,"#cfa650")+C(54,232,8,"#cfa650")+'</g>';
    if(f.clockOpen){ clock+=R(34,276,40,26,"#0d1419",'stroke="#cfa650" stroke-width="1.5"');
      if(!f.key) clock+=C(44,289,5,"none",'stroke="#aeb7bd" stroke-width="3"')+'<path d="M49 289h18M62 289v5" stroke="#aeb7bd" stroke-width="3"/>'; }
    var desk=R(112,276,10,72,"#3a2616")+R(224,276,10,72,"#3a2616")+R(106,242,134,36,"#5a3d28")+R(100,232,146,10,"#6e4c31")
      +'<polygon points="118,196 150,196 143,172 125,172" fill="#f0cf7a"/>'+R(133,196,3,36,"#8a6d2f")+'<polygon points="118,196 150,196 176,232 96,232" fill="#ffe9a8" opacity=".18"/>';
    var drawer=f.drawer ? R(138,246,70,8,"#0d1419")+R(133,254,80,28,"#7a5638",'stroke="#3a2616" stroke-width="2"')+C(173,268,4,"#cfa650")+R(150,247,34,7,"#efe4c8")
                        : R(138,246,70,24,"#6e4c31",'stroke="#3a2616" stroke-width="2"')+C(173,258,4,"#cfa650");
    var rug='<ellipse cx="150" cy="380" rx="92" ry="22" fill="#8a3b3b" stroke="#cfa650" stroke-width="2"/>'
      +(f.rug?'<path d="M62 374q22-28 50-10l-18 22z" fill="#5c2626" stroke="#cfa650" stroke-width="1.5"/>':'<ellipse cx="100" cy="375" rx="13" ry="5" fill="#a04a4a"/>');
    return hs("clock","Horloge comtoise",clock)+desk+hs("drawer","Tiroir du bureau",drawer)+hs("rug","Tapis",rug);
  },
  act:function(id,f){
    if(id==="rug"){ if(!f.rug){ f.rug=true; give("cle"); say("Vous soulevez le coin du tapis : une petite clé en laiton était glissée dessous."); } else say("Plus rien sous le tapis."); }
    else if(id==="drawer"){
      if(f.drawer) read("Billet dans le tiroir","« L'horloge est née quand la petite aiguille dormait sur le VII et la grande sur le IV. Rends-lui son heure. »");
      else if(S.sel==="cle"){ f.drawer=true; drop("cle"); say("La clé en laiton ouvre le tiroir. Un billet manuscrit s'y trouve : touchez le tiroir pour le lire."); }
      else say(has("cle") ? needSel("Le tiroir est fermé à clé.") : "Le tiroir est fermé à clé. La serrure est toute petite.");
    }
    else if(id==="clock"){
      if(f.clockOpen && !f.key){ f.key=true; give("clefer"); say("Vous prenez une lourde clé de fer dans le coffre de l'horloge."); }
      else if(f.clockOpen) say("L'horloge bat de nouveau, régulière.");
      else showClock();
    }
  },
  stage:function(f){ return !f.rug?0 : !f.drawer?1 : !f.clockOpen?2 : !f.key?3 : 4; },
  hints:[["Le sol mérite un coup d'œil.","Touchez le tapis : une clé est cachée dessous."],
    ["Une petite clé en laiton, un tiroir fermé…","Sélectionnez la clé en laiton, puis touchez le tiroir du bureau."],
    ["Lisez le billet du tiroir : il décrit la position des deux aiguilles.","Petite aiguille sur VII, grande sur IV : réglez l'horloge sur 7 h 20, puis remontez-la."],
    ["L'horloge s'est ouverte à sa base.","Touchez l'horloge pour prendre la clé de fer."],
    ["Vous tenez ce qu'il faut pour sortir.","Sélectionnez la clé de fer, puis touchez la porte."]]
},
/* 2 */{
  n:"La bibliothèque", th:{w:"#4a2b2b",w2:"#522f2f",p:"#33201a",fl:"#3f2a1c",d:"#6b4226"}, door:"code", code:"3524",
  intro:"Des livres du sol au plafond. La porte est fermée par un cadenas à quatre chiffres.",
  codeText:"Quatre molettes chiffrées ferment la porte.",
  init:function(){ return {}; },
  draw:function(){
    var b=R(20,78,176,254,"#3d2817")+R(28,86,160,240,"#1d130b"), hts=[58,50,62,54,60,48,56];
    SHELVES.forEach(function(row,r){
      var base=r===2?320:160+r*82;
      for(var i=0;i<row.length;i++){ var h=hts[(i+r*3)%7], x=32+i*22;
        b+=R(x,base-h,20,h,BOOKC[row[i]],'stroke="#1d130b" stroke-width="1"')+R(x+3,base-h+8,14,2,"#efe4c8",'opacity=".55"')+R(x+3,base-12,14,2,"#efe4c8",'opacity=".55"'); }
      b+=R(28,base,160,6,"#3d2817");
    });
    var lut=R(221,252,7,80,"#3d2817")+R(206,330,38,6,"#3d2817")+'<polygon points="202,254 248,238 248,230 202,246" fill="#6b4226"/>'
      +'<polygon points="207,243 244,230 244,222 207,235" fill="#efe4c8"/><path d="M225 229v8" stroke="#8a6d2f" stroke-width="1.5"/>';
    return hs("books","Bibliothèque",b)+hs("lutrin","Lutrin",lut);
  },
  act:function(id,f){
    if(id==="books") say("Trois rayonnages : des livres rouges, bleus, verts et dorés, mêlés à de vieux volumes gris.");
    else if(id==="lutrin"){ f.read=true; read("Livre ouvert sur le lutrin","« Qui veut sortir compte mes livres : les rouges d'abord, puis les bleus, les verts, et enfin les dorés. »"); }

},
/* 10 */{
  n:"La salle du trône", th:{w:"#4a4a52",w2:"#505058",p:"#38383f",fl:"#5a2a2a",d:"#6b5a2a"}, door:"flag", flag:"open",
  intro:"La dernière salle. Une tapisserie, un trône, cinq écus frappés d'une lettre. La grande porte n'a ni serrure ni poignée.",
  locked:"La grande porte n'a ni serrure ni poignée. Elle attend un mot.",
  init:function(){ return {seq:""}; },
  draw:function(f){
    var o;
    if(!f.tap) o=hs("tapis","Tapisserie",R(24,90,112,112,"#7a2f35",'stroke="#cfa650" stroke-width="3"')+R(20,86,120,6,"#cfa650")+'<path d="M80 112l22 34-22 34-22-34z" fill="none" stroke="#cfa650" stroke-width="2"/>'+C(80,146,8,"#cfa650"));
    else o=R(20,86,120,6,"#cfa650")+R(24,90,16,112,"#7a2f35",'stroke="#cfa650" stroke-width="2"')
      +hs("gravure","Inscription gravée",R(46,96,88,100,"#3f3f46",'stroke="#2c2c32" stroke-width="2"')+[110,124,138,152,166,180].map(function(y,i){ return R(54,y,[72,60,70,52,66,40][i],2,"#cfd0d6",'opacity=".75"'); }).join(""));
    o+='<path d="M170 92h56v70l-28 22-28-22z" fill="#2f4a7a" stroke="#cfa650" stroke-width="2"/><path d="M184 130l6-14 8 10 8-10 6 14z" fill="#cfa650"/>';
    var done=(f.seq||"").length;
    SHIELDS.forEach(function(L,i){ var x=38+i*44, lit=f.open||f.seq.indexOf(L)>=0;
      o+=hs("s"+L,"Écu "+L,'<path d="M'+(x-16)+' 214h32v18q0 14-16 20q-16-6-16-20z" fill="'+(lit?"#cfa650":"#8d979d")+'" stroke="#22190f" stroke-width="2"/>'+T(x,240,L,19,"#22190f")); });
    o+=R(98,268,64,70,"#5c2626",'stroke="#cfa650" stroke-width="3"')+R(90,300,80,12,"#7a2f35",'stroke="#cfa650" stroke-width="2"')+R(94,312,8,26,"#cfa650")+R(158,312,8,26,"#cfa650")+C(130,266,7,"#cfa650");
    return o;
  },
  act:function(id,f){
    if(id==="tapis"){ f.tap=true; say("Vous tirez la tapisserie sur le côté. Une inscription est gravée dans la pierre."); }
    else if(id==="gravure") read("Gravé dans la pierre","« Je passe sans marcher, je fuis sans courir. L'horloger me mesure, et nul ne me retient. Épelle mon nom sur les écus. »");
    else if(id.charAt(0)==="s"){
      if(f.open){ say("Les cinq écus brillent."); return; }
      var r=seq(id.charAt(1),"TEMPS"); tone(300+f.seq.length*60,0.3);
      if(r==="ok"){ f.open=true; tone(784,1.2); say("T, E, M, P, S. Les écus s'illuminent et la grande porte s'entrouvre."); }
      else if(r==="more") say("L'écu s'enfonce : "+f.seq.split("").join(" ")+" …");
      else say("Les écus reprennent leur place d'un coup sec. Ce n'est pas le bon mot.");
    }
  },
  stage:function(f){ return !f.tap?0 : !f.open?1 : 2; },
  hints:[["La tapisserie ne cache-t-elle rien ?","Touchez la tapisserie pour la tirer, puis lisez l'inscription."],
    ["Qu'est-ce qu'un horloger mesure toute sa vie ?","La réponse est TEMPS : touchez les écus T, E, M, P, S dans cet ordre."],
    ["La grande porte est ouverte.","Touchez la porte."]]
}];

/* ---------- Rendu ---------- */
function enter(i){
  var R0=ROOMS[i];
  S.r=i; S.f=R0.init(); S.inv=[]; S.sel=null; S.msg=R0.intro; S.hl={};
  closeModal(); render();
}
function render(){
  var R0=ROOMS[S.r];
  $("stage").innerHTML='<svg viewBox="0 0 360 420" preserveAspectRatio="xMidYMid slice" role="group" aria-label="'+R0.n+'">'+bg(R0.th)+R0.draw(S.f)+door(R0.th,R0.door)+(R0.over?R0.over(S.f):'')+'</svg>';
  $("step").textContent="Chambre "+(S.r+1)+" sur "+ROOMS.length;
  $("title").textContent=R0.n;
  $("msg").textContent=S.msg;
  $("timer").textContent=fmt(S.t);
  var h="";
  for(var i=0;i<6;i++){
    var it=S.inv[i];
    if(it) h+='<button class="slot" data-a="item:'+it+'" aria-pressed="'+(S.sel===it)+'" aria-label="'+ITEMS[it].n+'" title="'+ITEMS[it].n+'"><svg viewBox="0 0 40 40">'+ITEMS[it].s+'</svg></button>';
    else h+='<button class="slot" disabled aria-label="Emplacement vide"></button>';
  }
  $("inv").innerHTML=h;
  save();
}
function modal(html){ $("sheet").innerHTML=html; $("veil").hidden=false; var b=$("sheet").querySelector("button"); if(b) b.focus(); }
function closeModal(){ $("veil").hidden=true; $("sheet").innerHTML=""; }
function read(t,b){ modal('<h2>'+t+'</h2><p class="hand">'+b+'</p><div class="row"><button class="btn solid" data-a="close">Refermer</button></div>'); }

function showCode(title,text,ans,cb){
  tmp.code=ans.split("").map(function(){return 0;}); tmp.ans=ans; tmp.cb=cb;
  var w="";
  for(var i=0;i<ans.length;i++) w+='<div class="wheel"><button data-a="code:'+i+':1" aria-label="Augmenter le chiffre '+(i+1)+'">▲</button><output id="w'+i+'">0</output><button data-a="code:'+i+':-1" aria-label="Diminuer le chiffre '+(i+1)+'">▼</button></div>';
  modal('<h2>'+title+'</h2><p>'+text+'</p><div class="wheels">'+w+'</div><p class="note" id="codenote"></p>'
    +'<div class="row"><button class="btn solid" data-a="codeok">Ouvrir</button><button class="btn" data-a="close">Reculer</button></div>');
}
function showClock(note){
  modal('<h2>Horloge comtoise</h2><div class="dialbox"><svg viewBox="0 0 200 200" role="img" aria-label="Cadran : '+S.f.ch+' h '+(S.f.cm<10?'0':'')+S.f.cm+'">'+dial(100,100,92,true)+'</svg></div>'
    +'<div class="set"><div><button data-a="clk:h:-1" aria-label="Reculer d\'une heure">−</button><span>Heures</span><button data-a="clk:h:1" aria-label="Avancer d\'une heure">+</button></div>'
    +'<div><button data-a="clk:m:-5" aria-label="Reculer de cinq minutes">−</button><span>Minutes</span><button data-a="clk:m:5" aria-label="Avancer de cinq minutes">+</button></div></div>'
    +'<p class="note" style="margin-top:8px">'+(note||"L'horloge est arrêtée. Réglez l'heure, puis remontez le mécanisme.")+'</p>'
    +'<div class="row"><button class="btn solid" data-a="wind">Remonter l\'horloge</button><button class="btn" data-a="close">Reculer</button></div>');
}
function showHint(more){
  var R0=ROOMS[S.r], st=Math.min(R0.stage(S.f),R0.hints.length-1), lvl=S.hl[st];
  if(lvl===undefined){ lvl=0; S.hl[st]=0; S.h++; }
  else if(more && lvl===0){ lvl=1; S.hl[st]=1; S.h++; }
  save();
  modal('<h2>Indice</h2><p>'+R0.hints[st][lvl]+'</p><p class="note">Indices utilisés depuis le début : '+S.h+'</p><div class="row">'
    +(lvl===0?'<button class="btn" data-a="hintmore">Indice plus précis</button>':'')+'<button class="btn solid" data-a="close">Compris</button></div>');
}
function showRooms(){
  var h="";
  ROOMS.forEach(function(R0,i){
    var lock=i>S.max;
    h+='<button data-a="goto:'+i+'" '+(lock?'disabled':'')+' aria-current="'+(i===S.r)+'"><b>'+(i+1)+'</b><span>'+(lock?"Chambre fermée":R0.n)+'</span><i>'+(lock?"verrouillée":(i<S.max||S.won?"réussie":"en cours"))+'</i></button>';
  });
  modal('<h2>Les dix chambres</h2><p class="note">Choisir une chambre la reprend depuis son début.</p><div class="rooms">'+h+'</div>'
    +'<div class="row"><button class="btn solid" data-a="close">Retour au jeu</button><button class="btn" id="wipe" data-a="wipe">Tout effacer</button></div>');
}
function finish(){
  var last=S.r===ROOMS.length-1;
  tone(523,0.25); setTimeout(function(){ tone(784,0.6); },180);
  if(!last){
    if(S.max<S.r+1) S.max=S.r+1;
    say("La porte s'ouvre."); save();
    modal('<h2>Chambre '+(S.r+1)+' réussie</h2><p>La porte de « '+ROOMS[S.r].n+' » s\'ouvre. Derrière elle : '+ROOMS[S.r+1].n.charAt(0).toLowerCase()+ROOMS[S.r+1].n.slice(1)+'.</p>'
      +'<div class="stats"><div><b>'+fmt(S.t)+'</b><span>Temps total</span></div><div><b>'+S.h+'</b><span>Indices</span></div></div>'
      +'<div class="row"><button class="btn solid" data-a="next">Entrer dans la chambre '+(S.r+2)+'</button></div>');
  }else{
    S.won=true; say("La grande porte s'ouvre sur l'air frais de la nuit."); render();
    modal('<h2>Vous êtes libre</h2><p>La grande porte du manoir s\'ouvre. Derrière vous, toutes les horloges de maître Anselme sonnent en même temps. Vous avez traversé les dix chambres.</p>'
      +'<div class="stats"><div><b>'+fmt(S.t)+'</b><span>Temps total</span></div><div><b>'+S.h+'</b><span>Indices</span></div></div>'
      +'<div class="row"><button class="btn solid" data-a="replay">Rejouer depuis le début</button><button class="btn" data-a="rooms">Revoir une chambre</button></div>');
  }
}

/* ---------- Actions ---------- */
function tryDoor(){
  var R0=ROOMS[S.r];
  if(R0.door==="key"){
    if(S.sel===R0.key){ drop(R0.key); finish(); return; }
    say(has(R0.key) ? needSel("Vous avez de quoi ouvrir cette porte.") : R0.locked); render();
  }else if(R0.door==="code"){
    showCode("Porte verrouillée",R0.codeText,R0.code,finish);
  }else{
    if(S.f[R0.flag]) finish(); else { say(R0.locked); render(); }
  }
}
function action(a){
  var p=a.split(":"), i;
  if(!S.go && !S.won && p[0]==="hs") S.go=true;
  switch(p[0]){
    case "hs":
      if(p[1]==="door"){ tryDoor(); return; }
      ROOMS[S.r].act(p[1],S.f); render();
      break;
    case "item": S.sel = S.sel===p[1] ? null : p[1]; say(S.sel ? ITEMS[p[1]].n+" en main. Touchez l'endroit où l'utiliser." : "Vous rangez l'objet."); render(); break;
    case "close": closeModal(); break;
    case "hint": showHint(false); break;
    case "hintmore": showHint(true); break;
    case "rooms": showRooms(); break;
    case "goto": S.won=false; enter(+p[1]); break;
    case "next": enter(S.r+1); break;
    case "replay": restart(); break;
    case "wipe":
      var b=$("wipe");
      if(b.dataset.sure) restart(); else { b.dataset.sure="1"; b.textContent="Confirmer l'effacement"; }
      break;
    case "code":
      i=+p[1]; tmp.code[i]=(tmp.code[i]+ +p[2]+10)%10; $("w"+i).textContent=tmp.code[i]; break;
    case "codeok":
      if(tmp.code.join("")===tmp.ans){ closeModal(); tmp.cb(); }
      else $("codenote").textContent="Rien ne bouge. Ce n'est pas le bon chiffre.";
      break;
    case "clk":
      if(p[1]==="h") S.f.ch=((S.f.ch-1+ +p[2]+12)%12)+1; else S.f.cm=(S.f.cm+ +p[2]+60)%60;
      showClock(); save(); break;
    case "wind":
      if(S.f.ch===7 && S.f.cm===20){ S.f.clockOpen=true; closeModal(); tone(392,1); say("Le balancier repart, l'horloge sonne, et un petit coffre s'ouvre à sa base."); render(); }
      else showClock("Le mécanisme tourne à vide, puis s'arrête. Ce n'est pas la bonne heure.");
      break;
  }
}
function restart(){ var t=fresh(); S=t; enter(0); }

document.addEventListener("click",function(e){
  var el=e.target.closest ? e.target.closest("[data-a]") : null;
  if(el && !el.disabled) action(el.getAttribute("data-a"));
});
document.addEventListener("keydown",function(e){
  if((e.key==="Enter"||e.key===" ") && e.target.matches && e.target.matches("g[data-a]")){ e.preventDefault(); action(e.target.getAttribute("data-a")); }
});
setInterval(function(){
  if(S.go && !S.won && $("veil").hidden){ S.t++; $("timer").textContent=fmt(S.t); if(S.t%5===0) save(); }
},1000);

function start(data){
  var st=(data && data.S) || load();
  if(st && st.f && st.inv && ROOMS[st.r]){ S=st; render(); if(S.won) finish(); }
  else enter(0);
}
var hot = window.claude && window.claude.hot;
if(hot && hot.snapshot) hot.snapshot(function(){ return {S:S}; });
if(hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
